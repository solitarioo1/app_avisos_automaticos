{% extends "base.html" %}

{% block title %}Siniestros - Evaluación de Riesgo{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-clipboard2-pulse text-info"></i> Siniestros reportados</h4>
        <a href="/evaluacion-riesgo/" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Verificación manual
        </a>
    </div>

    <ul class="nav nav-pills mb-3" id="filtroEstado">
        <li class="nav-item"><button class="nav-link active" data-estado="">Todos</button></li>
        <li class="nav-item"><button class="nav-link" data-estado="Pendiente">Pendientes</button></li>
        <li class="nav-item"><button class="nav-link" data-estado="Verificado">Verificados</button></li>
        <li class="nav-item"><button class="nav-link" data-estado="Rechazado">Rechazados</button></li>
    </ul>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>N°</th><th>Fecha reporte</th><th>DNI</th><th>Agricultor</th>
                    <th>Cultivo</th><th>Evento</th><th>Fecha evento</th><th>Fotos</th><th>Estado</th><th></th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr><td colspan="10" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="{{ url_for('static', filename='js/inspector_siniestros.js') }}"></script>
{% endblock %}
