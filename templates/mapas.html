{% extends "base.html" %}

{% block title %}Mapas - La Positiva AgroSeguros{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/compiled/mapas.css') }}">
{% endblock %}

{% block content %}


<div class="container-fluid p-3 mapas-container">
    <h2 class="mb-1"><i class="bi bi-map"></i> Mapas Meteorológicos</h2>
    <p class="text-muted mb-3">Gestión y visualización de mapas por aviso</p>
    
    <!-- Filtros -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="filtro-numero" class="form-label">Número</label>
                            <input type="text" id="filtro-numero" class="form-control" placeholder="Ej: 4" oninput="aplicarFiltros()" />
                        </div>
                        <div class="col-md-3">
                            <label for="filtro-nivel" class="form-label">Nivel</label>
                            <select id="filtro-nivel" class="form-select" onchange="aplicarFiltros()">
                                <option value="">Todos</option>
                                <option value="rojo">Rojo</option>
                                <option value="naranja">Naranja</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="filtro-orden" class="form-label">Orden</label>
                            <select id="filtro-orden" class="form-select" onchange="aplicarFiltros()">
                                <option value="desc">Más Reciente</option>
                                <option value="asc">Más Antiguo</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button id="btnResetearFiltros" class="btn btn-secondary w-100" onclick="resetearFiltros()">
                                <i class="bi bi-arrow-clockwise"></i> Reset
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Grid de avisos -->
    <div class="avisos-grid" id="avisos-grid">
        <div class="text-center py-5" style="grid-column: 1/-1;">
            <i class="bi bi-hourglass-split display-4 text-muted spin"></i>
            <p class="text-muted mt-3">Cargando avisos...</p>
        </div>
    </div>
</div>

<!-- Modal para visualizar mapas con carrusel -->
<div class="modal fade" id="mapaModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header justify-content-center">
                <div class="text-center">
                    <h5 class="modal-title mb-0" id="mapaModalTitle">Mapas del Aviso</h5>
                    <div class="text-muted" id="mapaModalDepto" style="font-size: 13px; margin-top: 2px;"></div>
                </div>
                <button type="button" class="btn-close position-absolute" style="right: 1rem;" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div id="carouselContent"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/mapas.js') }}"></script>
{% endblock %}
