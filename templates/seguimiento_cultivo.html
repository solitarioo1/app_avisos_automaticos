{% extends "base.html" %}

{% block title %}Seguimiento de Cultivo - La Positiva AgroSeguros{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/compiled/seguimiento_cultivo.css') }}">
{% endblock %}

{% block content %}
<div class="seguimiento-container">
    <h2 class="mb-4">Seguimiento de Cultivo</h2>

    <div class="consulta-section">
        <div class="filtros-section">
            <div>
                <label for="filtro-departamento">Departamento</label>
                <select id="filtro-departamento">
                    <option value="">-- Selecciona --</option>
                </select>
            </div>
            <div>
                <label for="filtro-provincia">Provincia</label>
                <select id="filtro-provincia" disabled>
                    <option value="">-- Todas --</option>
                </select>
            </div>
            <div>
                <label for="filtro-distrito">Distrito</label>
                <select id="filtro-distrito" disabled>
                    <option value="">-- Todos --</option>
                </select>
            </div>
        </div>

        <div class="capas-toggle">
            <label><input type="checkbox" id="capa-zona_agricola" checked><span class="swatch" style="background:#c8e6c9;"></span>Zona Agrícola</label>
            <label><input type="checkbox" id="capa-sector_estadistico"><span class="swatch" style="background:#90caf9;"></span>Sector Estadístico</label>
            <label><input type="checkbox" id="capa-arroz"><span class="swatch" style="background:#fff59d;"></span>Arroz</label>
            <label><input type="checkbox" id="capa-mango"><span class="swatch" style="background:#ffab91;"></span>Mango</label>
        </div>
        <div id="capas-status" style="font-size:12px;color:#6c757d;margin-bottom:0.75rem;"></div>

        <form id="form-consulta" class="consulta-form">
            <div>
                <label for="input-lat">Latitud</label>
                <input type="number" step="any" id="input-lat" placeholder="-11.362759" required>
            </div>
            <div>
                <label for="input-lon">Longitud</label>
                <input type="number" step="any" id="input-lon" placeholder="-74.515862" required>
            </div>
            <div>
                <label for="input-fecha">Fecha</label>
                <input type="date" id="input-fecha" required>
            </div>
            <div>
                <label for="input-cultivo">Cultivo</label>
                <select id="input-cultivo">
                    <option value="papa">Papa</option>
                    <option value="arroz">Arroz (próximamente)</option>
                    <option value="maiz">Maíz (próximamente)</option>
                </select>
            </div>
            <div>
                <button type="submit" class="btn-consultar">Consultar</button>
            </div>
        </form>
    </div>

    <div id="mapa-seguimiento"></div>

    <div id="resultado" class="resultado-section">
        <strong id="resultado-titulo"></strong>
        <p id="resultado-mensaje" class="mb-0"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="{{ url_for('static', filename='js/seguimiento_cultivo.js') }}"></script>
{% endblock %}
