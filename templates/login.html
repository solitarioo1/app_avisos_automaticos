<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Positiva — Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/static/img/imagen_icono.jpeg" type="image/jpeg">






<link rel="stylesheet" href="{{ url_for('static', filename='css/compiled/login.css') }}">
</head>
<body>
<div class="login-bg">
    <div class="login-card text-center">

        <!-- Logo -->
        <img src="/static/img/logo-positiva.png"
             alt="La Positiva"
             class="login-logo"
             onerror="this.style.display='none'">

        <div class="login-title">Visor web Seguro Agrario</div>
        <div class="login-subtitle">La Positiva Seguros </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert-login mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
            </div>
            {% endfor %}
        {% endwith %}

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off" novalidate>

            <div class="mb-3 text-start">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Ingresa tu usuario"
                           required
                           autofocus>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password"
                           id="password-field"
                           name="password"
                           class="form-control"
                           placeholder="Ingresa tu contraseña"
                           required>
                    <button type="button"
                            class="btn-toggle-pw btn"
                            onclick="togglePassword()"
                            tabindex="-1">
                        <i class="bi bi-eye-fill" id="pw-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </button>
        </form>

        <div class="login-divider"></div>

        <!-- Badge modo testing -->
        <span class="badge-test text-white">
            <i class="bi bi-cone-striped me-1"></i> solitario / solitario
        </span>

    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
