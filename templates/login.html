<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Positiva — Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/static/img/imagen_icono.jpeg" type="image/jpeg">



<style>
    /* ── Variables ── */
    :root {
        --turquesa:   #04ccc4;
        --turquesa-d: #039e97;
        --naranja:    #fc6c44;
        --white:      #ffffff;
    }

    /* ── Fondo ── */
    html, body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-bg {
        min-height: 100vh;
        background:
            linear-gradient(135deg, rgba(4,204,196,.82) 0%, rgba(252,108,68,.72) 100%),
            url('/static/img/mapaPeru.avif') center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    /* ── Card ── */
    .login-card {
        width: 100%;
        max-width: 420px;
        background: rgba(0,0,0,0.20);        /* ← más oscuro que antes */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        color: var(--white);
    }

    /* ── Logo ── */
    .login-logo {
        width: 90px;
        border-radius: 12px;
        margin-bottom: .75rem;
        box-shadow: 0 4px 16px rgba(0,0,0,0.30);
    }

    .login-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: .2rem;
    }

    .login-subtitle {
        font-size: .875rem;
        opacity: .80;
        margin-bottom: 2rem;
    }

    /* ── Labels ── */
    .form-label {
        font-size: .8rem;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        opacity: .85;
    }

    /* ── Inputs OSCUROS ── */
    .input-group-text {
        background: rgba(0,0,0,0.28);
        border: 1px solid rgba(255,255,255,0.15);
        color: rgba(255,255,255,0.80);
    }

    .form-control {
        background: rgba(0,0,0,0.28);
        border: 1px solid rgba(255,255,255,0.15);
        color: var(--white);
        padding: .65rem 1rem;
    }

    .form-control::placeholder {
        color: rgba(255,255,255,0.40);
    }

    .form-control:focus {
        background: rgba(0,0,0,0.38);
        border-color: var(--turquesa);
        box-shadow: 0 0 0 3px rgba(4,204,196,0.22);
        color: var(--white);
        outline: none;
    }

    /* ── Toggle contraseña ── */
    .btn-toggle-pw {
        background: rgba(0,0,0,0.28);
        border: 1px solid rgba(255,255,255,0.15);
        color: rgba(255,255,255,0.75);
        cursor: pointer;
    }

    .btn-toggle-pw:hover {
        background: rgba(0,0,0,0.42);
        color: var(--white);
    }

    /* ── Botón principal ── */
    .btn-login {
        background: var(--turquesa);         /* ← turquesa en vez de blanco */
        color: var(--white);
        font-weight: 700;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        padding: .75rem;
        transition: transform .15s, box-shadow .15s, background .15s;
        letter-spacing: .02em;
    }

    .btn-login:hover {
        background: var(--turquesa-d);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(4,204,196,0.35);
        color: var(--white);
    }

    .btn-login:active {
        transform: translateY(0);
    }

    /* ── Badge testing ── */
    .badge-test {
        background: rgba(0,0,0,0.20);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 20px;
        font-size: .72rem;
        padding: .3rem .75rem;
        letter-spacing: .04em;
    }

    /* ── Alerta error ── */
    .alert-login {
        background: rgba(220,53,69,0.30);
        border: 1px solid rgba(220,53,69,0.50);
        color: var(--white);
        border-radius: 10px;
        font-size: .875rem;
        padding: .65rem 1rem;
    }

    /* ── Divider ── */
    .login-divider {
        border-top: 1px solid rgba(255,255,255,0.15);
        margin: 1.5rem 0;
    }
</style>


</head>
<body>
<div class="login-bg">
    <div class="login-card text-center">

        <!-- Logo -->
        <img src="/static/img/logo-positiva.png"
             alt="La Positiva"
             class="login-logo"
             onerror="this.style.display='none'">

        <div class="login-title">Visor web Seguro Agrario</div>
        <div class="login-subtitle">La Positiva Seguros </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert-login mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
            </div>
            {% endfor %}
        {% endwith %}

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off" novalidate>

            <div class="mb-3 text-start">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Ingresa tu usuario"
                           required
                           autofocus>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password"
                           id="password-field"
                           name="password"
                           class="form-control"
                           placeholder="Ingresa tu contraseña"
                           required>
                    <button type="button"
                            class="btn-toggle-pw btn"
                            onclick="togglePassword()"
                            tabindex="-1">
                        <i class="bi bi-eye-fill" id="pw-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </button>
        </form>

        <div class="login-divider"></div>

        <!-- Badge modo testing -->
        <span class="badge-test text-white">
            <i class="bi bi-cone-striped me-1"></i> admin / admin
        </span>

    </div>
</div>

<script>
    function togglePassword() {
        const field = document.getElementById('password-field');
        const icon  = document.getElementById('pw-icon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.replace('bi-eye-fill', 'bi-eye-slash-fill');
        } else {
            field.type = 'password';
            icon.classList.replace('bi-eye-slash-fill', 'bi-eye-fill');
        }
    }
</script>
</body>
</html>
